  <script>
    const owner = "Fgeeha";
    const repository = "fgeeha.github.io";
    const directory = "study";

    const container = document.getElementById("pages");

    async function loadPages() {
      try {
        const apiUrl =
          `https://api.github.com/repos/${owner}/${repository}/contents/${directory}`;

        const response = await fetch(apiUrl);

        if (!response.ok) {
          throw new Error(`GitHub API вернул ошибку ${response.status}`);
        }

        const files = await response.json();
        const listed = new Set(
          [...container.querySelectorAll("a")].map(link => link.getAttribute("href"))
        );

        const newFiles = files
          .filter(file =>
            file.type === "file" &&
            file.name.endsWith(".html") &&
            file.name !== "index.html" &&
            !listed.has(encodeURIComponent(file.name))
          )
          .sort((a, b) => a.name.localeCompare(b.name));

        for (const file of newFiles) {
          const link = document.createElement("a");

          link.className = "page-link";
          link.href = encodeURIComponent(file.name);
          link.textContent = formatTitle(file.name);

          container.appendChild(link);
        }
      } catch (error) {
        // The listed tutorials stay; only the auto-discovery of new pages is skipped.
        console.warn("Не удалось загрузить список страниц: " + error.message);
      }
    }

    function formatTitle(filename) {
      return filename
        .replace(/\.html$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, letter => letter.toUpperCase());
    }

    loadPages();
  </script>
